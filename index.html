<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vita — health, all in one place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6F1; --bg2:#FBE9E1; --surface:#FFFFFF; --surface-2:#FDF3EE;
  --ink:#3A3330; --ink-2:#8A7C74; --ink-3:#B7A99F;
  --line:#F1E3DB; --line-2:#E8D6CB;
  --primary:#EF7D5E; --primary-600:#E36847; --primary-soft:#FCE3DA;
  --sage:#3E9C8C; --sage-600:#348476; --sage-soft:#DCF0EC;
  --lav:#8C7BC4; --lav-soft:#ECE6F6;
  --amber:#DF9330; --amber-soft:#FAEAD1;
  --danger:#D6543F; --danger-soft:#FBDFD9;
  --good:#4EA37C; --good-soft:#DDF0E6;
  --shadow:0 2px 4px rgba(58,51,48,.04),0 14px 30px -14px rgba(58,51,48,.18);
  --shadow-sm:0 1px 2px rgba(58,51,48,.05),0 8px 16px -12px rgba(58,51,48,.2);
  --r:18px; --r-sm:12px; --r-lg:26px;
  --font:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --display:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px}
h1,h2,h3,h4{margin:0;font-weight:700}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2.5px solid var(--primary);outline-offset:1px}
a{color:var(--sage-600)}
svg{vertical-align:middle}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px;border:2px solid var(--bg)}
::selection{background:var(--primary-soft)}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;
  padding:12px 20px;background:rgba(255,246,241,.82);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.5px}
.brand .dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(140deg,var(--primary),#F2A57E);
  display:grid;place-items:center;box-shadow:0 6px 14px -6px var(--primary)}
.brand .dot svg{width:18px;height:18px;color:#fff}
.brand small{font-family:var(--font);font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
.spacer{flex:1}
.toggle{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;box-shadow:var(--shadow-sm)}
.toggle button{display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--ink-2);transition:.16s}
.toggle button svg{width:16px;height:16px}
.toggle button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.toggle button[data-view="doctor"][aria-selected="true"]{color:var(--sage-600)}
.who{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-sm)}
.who .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.who .meta{line-height:1.15}
.who .meta b{font-size:13.5px}
.who .meta span{display:block;font-size:11px;color:var(--ink-2);font-weight:600}
@media(max-width:680px){.who .meta{display:none}.brand small{display:none}}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:230px 1fr;gap:0;min-height:calc(100vh - 60px)}
.side{padding:18px 12px;border-right:1px solid var(--line);position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.side .lbl{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);padding:6px 12px 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:14px;color:var(--ink-2);width:100%;text-align:left;transition:.14s;position:relative}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);font-weight:700}
.nav button[aria-current="true"] svg{color:var(--primary)}
.doctor .nav button[aria-current="true"] svg{color:var(--sage)}
.nav .bdg{margin-left:auto;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--primary);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.main{padding:26px 30px 60px;max-width:1020px;width:100%}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:60px;height:auto;border-right:none;border-bottom:1px solid var(--line);
    padding:8px;display:flex;gap:6px;overflow-x:auto}
  .side .lbl{display:none}
  .nav{flex-direction:row;gap:6px}
  .nav button{flex-direction:column;gap:4px;padding:8px 12px;font-size:11px;min-width:70px;text-align:center;border-radius:14px}
  .nav .bdg{position:absolute;top:4px;right:10px;margin:0}
  .main{padding:20px 16px 80px}
}

/* ---------- primitives ---------- */
.page-head{margin-bottom:22px}
.page-head h1{font-family:var(--display);font-weight:500;font-size:30px;letter-spacing:-.5px}
.page-head p{color:var(--ink-2);margin:5px 0 0;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:18px}
.card.pad-lg{padding:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.sec-title{font-size:12.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);margin:26px 0 12px}
.sec-title:first-child{margin-top:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:11px;font-weight:700;font-size:13.5px;transition:.15s;border:1px solid transparent}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 14px -6px var(--primary)}
.btn-primary:hover{background:var(--primary-600)}
.btn-sage{background:var(--sage);color:#fff;box-shadow:0 6px 14px -6px var(--sage)}
.btn-sage:hover{background:var(--sage-600)}
.btn-ghost{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:var(--bg2)}
.btn-quiet{background:transparent;color:var(--ink-2);padding:7px 10px}
.btn-quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700}
.pill.primary{background:var(--primary-soft);color:var(--primary-600)}
.pill.sage{background:var(--sage-soft);color:var(--sage-600)}
.pill.lav{background:var(--lav-soft);color:var(--lav)}
.pill.amber{background:var(--amber-soft);color:#B4741A}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.grey{background:var(--surface-2);color:var(--ink-2)}
.dot-i{width:7px;height:7px;border-radius:50%;background:currentColor}

.av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);transition:.15s}
.inp:hover{border-color:var(--ink-3)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.5}
.divide{height:1px;background:var(--line);margin:16px 0}

.list-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.progress{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--sage)}
.progress.low i{background:var(--amber)}
.progress.crit i{background:var(--danger)}

.flag{display:flex;gap:11px;padding:12px 14px;border-radius:13px;align-items:flex-start}
.flag.high{background:var(--danger-soft)}
.flag.moderate{background:var(--amber-soft)}
.flag .fi{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;margin-top:1px}
.flag.high .fi{background:var(--danger)}
.flag.moderate .fi{background:var(--amber)}
.flag b{font-weight:800}

.banner{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(120deg,var(--sage-soft),#EAF6F2);
  border:1px solid #CDE8E1;border-radius:var(--r);padding:14px 16px;margin-bottom:20px}
.banner .bi{width:30px;height:30px;border-radius:9px;background:var(--sage);color:#fff;display:grid;place-items:center;flex:none}
.banner .bi svg{width:17px;height:17px}
.banner button.x{margin-left:auto;color:var(--sage-600)}

/* messaging */
.msg-wrap{display:grid;grid-template-columns:250px 1fr;gap:0;height:560px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
@media(max-width:760px){.msg-wrap{grid-template-columns:1fr;height:auto}.msg-list.hide-mobile{display:none}}
.msg-list{border-right:1px solid var(--line);overflow-y:auto;background:var(--surface-2)}
.thread{display:flex;gap:10px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.thread:hover{background:var(--bg2)}
.thread[aria-current="true"]{background:var(--surface)}
.thread .tinfo{min-width:0;flex:1}
.thread .tinfo b{display:block;font-size:13.5px}
.thread .tinfo span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.msg-panel{display:flex;flex-direction:column;min-height:0}
.msg-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.msg-body{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.bubble{max-width:74%;padding:10px 13px;border-radius:15px;font-size:14px;line-height:1.45;box-shadow:var(--shadow-sm)}
.bubble.them{align-self:flex-start;background:var(--surface);border-bottom-left-radius:5px}
.bubble.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:5px}
.doctor .bubble.me{background:var(--sage)}
.bubble .t{display:block;font-size:10.5px;opacity:.7;margin-top:4px;font-weight:600}
.msg-compose{display:flex;gap:9px;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.msg-compose .inp{flex:1}

/* chart */
.chart-wrap{width:100%;overflow-x:auto}
.chart-wrap svg{display:block;width:100%;height:auto;min-width:420px}
.metric-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.metric-pills button{padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.metric-pills button[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat{background:var(--surface-2);border-radius:14px;padding:13px 15px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:500;letter-spacing:-.5px}
.stat span{font-size:12px;color:var(--ink-2);font-weight:700}

/* toast */
.toast-host{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:11px;background:var(--ink);color:#fff;padding:12px 17px;border-radius:14px;
  box-shadow:0 16px 40px -12px rgba(0,0,0,.4);font-weight:600;font-size:14px;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.toast .ti{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:none}
.toast.sync .ti{background:var(--primary)}
.toast.ok .ti{background:var(--good)}
.toast small{display:block;font-weight:600;opacity:.7;font-size:11.5px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(58,51,48,.4);backdrop-filter:blur(3px);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 30px 70px -20px rgba(0,0,0,.4);width:100%;max-width:440px;padding:24px;animation:pop .26s}
.modal h3{font-family:var(--display);font-weight:500;font-size:22px;margin-bottom:4px}
.modal .close{position:absolute;top:16px;right:16px}

/* telehealth */
.tele{position:fixed;inset:0;z-index:85;background:#2A2320;display:flex;flex-direction:column;animation:fade .2s}
.tele-top{padding:14px 20px;display:flex;align-items:center;gap:12px;color:#fff}
.tele-main{flex:1;display:grid;grid-template-columns:1fr 320px;gap:16px;padding:0 20px 20px;min-height:0}
@media(max-width:820px){.tele-main{grid-template-columns:1fr}}
.tele-video{background:linear-gradient(160deg,#4a4038,#332b26);border-radius:var(--r);position:relative;display:grid;place-items:center;overflow:hidden}
.tele-video .big-av{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:800;color:#fff;background:var(--sage)}
.tele-video .self{position:absolute;bottom:14px;right:14px;width:120px;height:82px;border-radius:12px;background:#5a4f46;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;border:2px solid rgba(255,255,255,.2)}
.tele-chart{background:var(--surface);border-radius:var(--r);padding:18px;overflow-y:auto}
.tele-controls{display:flex;gap:12px;justify-content:center;padding:8px 0 4px}
.tele-controls button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}
.tele-controls button svg{width:22px;height:22px}
.tele-controls button.end{background:var(--danger);width:auto;padding:0 22px;border-radius:26px;font-weight:700;gap:8px}

.doc-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--sage-soft);color:var(--sage-600);font-size:11.5px;font-weight:800}
.empty{text-align:center;padding:40px 20px;color:var(--ink-2)}
.empty svg{width:40px;height:40px;color:var(--ink-3);margin-bottom:8px}
.hint{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:8px}
.kbd{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot" id="brandDot"></span>
    <span>Vita<br><small>direct care, all in one</small></span>
  </div>
  <div class="spacer"></div>
  <div class="toggle" role="tablist" aria-label="Switch view">
    <button role="tab" data-view="patient" data-action="set-view" aria-selected="true"><span id="ic-user"></span>Patient</button>
    <button role="tab" data-view="doctor" data-action="set-view" aria-selected="false"><span id="ic-steth"></span>Doctor</button>
  </div>
  <div class="who" id="whoChip"></div>
</header>

<div id="patient-app">
  <div class="app">
    <aside class="side"><div class="lbl">Maya's Vita</div><nav class="nav" id="patient-nav"></nav></aside>
    <main class="main" id="patient-main"></main>
  </div>
</div>

<div id="doctor-app" class="doctor" hidden>
  <div class="app">
    <aside class="side"><div class="lbl">Dr. Reyes · Cedar Direct Care</div><nav class="nav" id="doctor-nav"></nav></aside>
    <main class="main" id="doctor-main"></main>
  </div>
</div>

<div class="toast-host" id="toastHost"></div>
<div id="modalHost"></div>
<div id="teleHost"></div>

<script>
/* ============================ ICONS ============================ */
const P={
  home:'<path d="M3 11.4 12 4l9 7.4"/><path d="M5 10.2V20h5v-6h4v6h5v-9.8"/>',
  chat:'<path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5Z"/>',
  cal:'<rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 9.5h18"/>',
  clip:'<rect x="5" y="4" width="14" height="17" rx="2.5"/><rect x="9" y="2.5" width="6" height="3.5" rx="1.2"/><path d="M8.5 11h7M8.5 15h5"/>',
  pill:'<path d="M10.6 3.6 3.6 10.6a5 5 0 0 0 7 7l7-7a5 5 0 0 0-7-7Z"/><path d="M7.1 7.1 14 14"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',
  folder:'<path d="M3 7.5a2 2 0 0 1 2-2h3.6l2 2H19a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',
  chart:'<path d="M4 4v16h16"/><path d="M7.5 14l3.2-3.4 3 2 4.8-5.8"/>',
  leaf:'<path d="M20 4C9 4 4 8.5 4 13.5A6.5 6.5 0 0 0 10.5 20C15.5 20 20 15 20 4Z"/><path d="M4.5 19.5 12 12"/>',
  spark:'<path d="M12 3l1.7 4.6L18.3 9l-4.6 1.4L12 15l-1.7-4.6L5.7 9l4.6-1.4z"/><path d="M18 14.5l.8 2.1 2.2.8-2.2.8-.8 2.1-.8-2.1-2.2-.8 2.2-.8z"/>',
  video:'<rect x="2" y="6" width="14" height="12" rx="2.5"/><path d="M16 10.2 22 7v10l-6-3.2z"/>',
  edit:'<path d="M4 20h4.5L20 8.5 15.5 4 4 15.5z"/><path d="M13.8 5.7 18.3 10.2"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>',
  users:'<circle cx="9" cy="8" r="3.4"/><path d="M2.6 20a6.4 6.4 0 0 1 12.8 0"/><path d="M16.5 4.9a3.4 3.4 0 0 1 0 6.6"/><path d="M18.4 20a6.4 6.4 0 0 0-3-5.3"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.2-4.2"/>',
  steth:'<path d="M5 3v6a5 5 0 0 0 10 0V3"/><path d="M5 3H3.2M15 3h1.8"/><path d="M10 14.6V16a5.4 5.4 0 0 0 10.8 0v-1.2"/><circle cx="20.8" cy="12.4" r="2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M4 12.5l5 5L20 6.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  send:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',
  refill:'<path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v5h-5"/>',
  dl:'<path d="M12 3.5v11M7.5 10 12 14.5 16.5 10"/><path d="M4.5 20.5h15"/>',

function checkInteractions(){
  const items=[...state.patient.meds.map(m=>({name:m.name,kind:'medication'})),
               ...state.patient.supplements.map(s=>({name:s.name,kind:'supplement'})),
               ...((state.patient.tcm||[]).filter(t=>t.kind==='herb').map(t=>({name:t.name,kind:'TCM herb'})))];
  const out=[];const seen=new Set();
  for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
    const x=items[i].name.toLowerCase(),y=items[j].name.toLowerCase();
    for(const r of RULES){
      const hit=(x.includes(r.a)&&y.includes(r.b))||(x.includes(r.b)&&y.includes(r.a));
      if(hit){const key=[items[i].name,items[j].name].sort().join('|');if(!seen.has(key)){seen.add(key);
        out.push({sev:r.sev,note:r.note,a:items[i].name,b:items[j].name});}}
    }
  }
  return out.sort((p,q)=>p.sev==='high'?-1:1);
}

/* ============================ CHART ============================ */
function chart(series,unit){
  const w=560,h=210,L=40,R=16,T=16,B=30;
  let all=[];series.forEach(s=>s.pts.forEach(p=>{all.push(p.v);if(p.v2!=null)all.push(p.v2);}));
  let min=Math.min(...all),max=Math.max(...all);const pad=(max-min||1)*0.18;min-=pad;max+=pad;
  const n=series[0].pts.length;
  const X=i=>L+(n<=1?(w-L-R)/2:i*(w-L-R)/(n-1));
  const Y=v=>T+(1-(v-min)/(max-min||1))*(h-T-B);
  let g='';for(let k=0;k<=3;k++){const val=max-(k*(max-min)/3);const y=T+k*(h-T-B)/3;
    g+='<line x1="'+L+'" y1="'+y+'" x2="'+(w-R)+'" y2="'+y+'" stroke="var(--line)"/>'+
       '<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" font-weight="700" fill="var(--ink-3)">'+(Math.round(val*10)/10)+'</text>';}
  let xl='';series[0].pts.forEach((p,i)=>{xl+='<text x="'+X(i)+'" y="'+(h-8)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink-2)">'+esc(p.t)+'</text>';});
  let paths='';
  series.forEach((s,si)=>{
    const col=si===0?s.color:'var(--ink-3)';
    const key=si===0?'v':'v2';
    let d='',dots='',area='';
    s.pts.forEach((p,i)=>{const val=si===0?p.v:p.v2;if(val==null)return;const x=X(i),y=Y(val);d+=(i?'L':'M')+x+' '+y+' ';});
    if(si===0){const first=X(0),last=X(n-1);area='<path d="'+d+'L'+last+' '+(h-B)+' L'+first+' '+(h-B)+' Z" fill="'+col+'" opacity="0.09"/>';}
    s.pts.forEach((p,i)=>{const val=si===0?p.v:p.v2;if(val==null)return;const x=X(i),y=Y(val);
      dots+='<circle cx="'+x+'" cy="'+y+'" r="'+(si===0?4:3)+'" fill="var(--surface)" stroke="'+col+'" stroke-width="'+(si===0?2.5:2)+'"/>';});
    paths+=area+'<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+(si===0?2.6:1.8)+'" stroke-linecap="round" stroke-linejoin="round" '+(si?'stroke-dasharray="4 4"':'')+'/>'+dots;
  });
  return '<div class="chart-wrap"><svg viewBox="0 0 '+w+' '+h+'" role="img">'+g+paths+xl+'</svg></div>';
}

function botReply(text){
  const q=text.toLowerCase();const p=state.patient;
  const diag=['diagnos','do i have','what\u2019s wrong','whats wrong','is it cancer','am i having','should i be worried','why do i feel','why am i','what disease','is this serious','heart problem','heart attack','stroke'];
  if(diag.some(k=>q.includes(k)))
    return 'I can\u2019t diagnose you or tell you what a symptom means — that\u2019s exactly what Dr. Reyes is for, and she\u2019s quick to reach. Open the Messages tab and text Dr. Marisol Reyes; if it feels urgent, call 911. I\u2019m glad to help you word what you\u2019re noticing so the message is clear.';
  if(q.includes('warfarin')||q.includes('how many days')||q.includes('refill')||q.includes('run out')||q.includes('medication')){
    const m=[...p.meds].sort((a,b)=>a.daysLeft-b.daysLeft);
    return 'Here\u2019s where your medications stand:\n'+m.map(x=>'• '+x.name+' ('+x.dose+') — '+x.daysLeft+' days left').join('\n')+'\nTap Refill now in the Medications tab and I\u2019ll send it to '+p.pharmacy.name+'.';
  }
  if(q.includes('interaction')||q.includes('safe with')||q.includes('turmeric')||q.includes('st john')||q.includes('st. john')){
    const f=checkInteractions();
    if(f.length)return 'Worth knowing about your current mix:\n'+f.map(x=>'• '+x.a+' + '+x.b+' — '+x.note).join('\n')+'\nI\u2019d run these by Dr. Reyes before changing anything.';
    return 'Nothing in your current meds and supplements is flagging right now. Add something new and I\u2019ll re-check automatically.';
  }
  if(q.includes('bill')||q.includes('owe')||q.includes('pay')||q.includes('cost')||q.includes('charge')){
    const due=p.billing.filter(b=>b.status==='due');
    if(!due.length)return 'You\u2019re all paid up — no open charges right now.';
    return 'You have '+due.length+' open charge'+(due.length>1?'s':'')+', totaling '+money(due.reduce((s,b)=>s+b.amount,0))+':\n'+due.map(b=>'• '+b.desc+' — '+money(b.amount)+', due '+fmtDate(b.due)).join('\n')+'\nPay any of them from the Billing tab with your '+p.payment+'.';
  }
  if(q.includes('appointment')||q.includes('next visit')||q.includes('schedule')||q.includes('book')){
    const a=[...p.appts].sort((x,y)=>x.date<y.date?-1:1)[0];
    return a?'Your next visit is '+a.type+' with '+a.doctor+' on '+fmtDate(a.date)+' at '+a.time+' ('+a.mode+'). Want another? The Schedule tab lets you search any doctor and grab a slot.':'You have no upcoming visits — head to Schedule to book one.';
  }
  if(q.includes('note')||q.includes('explain')||q.includes('simpl')||q.includes('understand')){
    const n=p.notes[0];
    return 'Here\u2019s '+n.doctor+'\u2019s '+n.type+' from '+fmtDate(n.date)+', in plain terms: your heart rhythm is well controlled on your current medicines, your blood-thinner level was right where it should be, and the plan is to keep everything the same and recheck in about a month. Nothing to worry about. Want me to help you write a follow-up question for '+n.doctor+'?';
  }
  if(q.includes('hello')||q.startsWith('hi')||q.includes('hey'))
    return 'Hi Maya! I can pull anything from your tabs — meds, bills, visits, notes, supplements. What would help right now?';
  return 'I can help you make sense of your meds, bills, notes, visits, and supplements — I can see all of them. I just won\u2019t diagnose symptoms; for that I\u2019ll send you to Dr. Reyes. Try one of the suggestions above, or ask me to explain something in a tab.';
}

/* ============================ CONNECTIONS ============================ */
function pearson(a,b){const n=Math.min(a.length,b.length);let sx=0,sy=0,sxy=0,sx2=0,sy2=0;for(let i=0;i<n;i++){const x=a[i].v,y=b[i].v;sx+=x;sy+=y;sxy+=x*y;sx2+=x*x;sy2+=y*y;}const den=Math.sqrt((n*sx2-sx*sx)*(n*sy2-sy*sy));return den?(n*sxy-sx*sy)/den:0;}
function strengthLabel(r){const a=Math.abs(r);return a>=0.7?'strong':a>=0.4?'moderate':'weak';}
function connChart(a,b,ca,cb){
  const w=560,h=160,L=14,R=14,T=14,B=26;const norm=arr=>{const vs=arr.map(x=>x.v);const mn=Math.min(...vs),mx=Math.max(...vs);return arr.map(x=>({t:x.d||x.t,n:(x.v-mn)/((mx-mn)||1)}));};
  const A=norm(a),Bn=norm(b);const n=A.length;const X=i=>L+i*(w-L-R)/((n-1)||1);const Y=v=>T+(1-v)*(h-T-B);
  const line=(pts,col)=>{let d='';pts.forEach((p,i)=>d+=(i?'L':'M')+X(i)+' '+Y(p.n)+' ');let dots='';pts.forEach((p,i)=>dots+='<circle cx="'+X(i)+'" cy="'+Y(p.n)+'" r="3.4" fill="var(--surface)" stroke="'+col+'" stroke-width="2.3"/>');return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'+dots;};
  let xl='';A.forEach((p,i)=>xl+='<text x="'+X(i)+'" y="'+(h-8)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink-2)">'+esc(p.t)+'</text>');
  return '<div class="chart-wrap"><svg viewBox="0 0 '+w+' '+h+'" role="img">'+line(A,ca)+line(Bn,cb)+xl+'</svg></div>';
}
function connCard(inner){return '<div class="card" style="margin-bottom:16px">'+inner+'</div>';}
function pConnections(){
  const p=state.patient;
  const rMS=pearson(p.habits.meditation,p.habits.sleep);
  const medSleep=connCard('<div class="between" style="margin-bottom:10px"><div class="row" style="gap:8px"><span style="width:32px;height:32px;border-radius:9px;background:var(--lav-soft);color:var(--lav);display:grid;place-items:center">'+icon('link')+'</span><b>Meditation &amp; sleep</b></div><span class="pill '+(rMS>=0.4?'good':'grey')+'">'+strengthLabel(rMS)+' positive link (r = '+rMS.toFixed(2)+')</span></div>'+
    '<p class="muted" style="margin:0 0 12px">On the days you meditate more, you tend to sleep longer. This past week your longest sleep followed your longest sessions.</p>'+connChart(p.habits.meditation,p.habits.sleep,'var(--lav)','#5C7CB8')+
    '<div class="row" style="gap:16px;justify-content:center;margin-top:6px"><span class="tiny muted" style="font-weight:700"><span class="dot-i" style="background:var(--lav);display:inline-block;margin-right:5px"></span>Meditation (min)</span><span class="tiny muted" style="font-weight:700"><span class="dot-i" style="background:#5C7CB8;display:inline-block;margin-right:5px"></span>Sleep (hrs)</span></div>'+
    '<div class="row" style="gap:8px;margin-top:14px"><button class="btn btn-primary btn-sm" data-action="conn-send" data-msg="Vita noticed a pattern: on days I meditate more, I sleep longer (this week the link was strong). Wanted to share in case it\u2019s useful.">'+icon('send')+'Send to Dr. Reyes</button>'+(p.careCircle.open?'<button class="btn btn-ghost btn-sm" data-action="conn-circle" data-msg="Sharing a pattern from my log: more meditation lines up with longer sleep.">Share to Care Circle</button>':'')+'</div>');
  const rSH=pearson(p.trends.steps.pts,p.trends.hr.pts.map(x=>({v:-x.v})));
  const stepHr=connCard('<div class="between" style="margin-bottom:10px"><div class="row" style="gap:8px"><span style="width:32px;height:32px;border-radius:9px;background:var(--sage-soft);color:var(--sage);display:grid;place-items:center">'+icon('link')+'</span><b>Daily steps &amp; resting heart rate</b></div><span class="pill good">'+strengthLabel(rSH)+' link</span></div><p class="muted" style="margin:0">As your average daily steps climbed this year, your resting heart rate drifted down — a sign your cardio fitness is trending the right way.</p>'+
    '<div class="row" style="gap:8px;margin-top:14px"><button class="btn btn-primary btn-sm" data-action="conn-send" data-msg="My resting heart rate has been dropping as my daily steps go up over the last few months. Thought you\u2019d want to see the trend.">'+icon('send')+'Send to Dr. Reyes</button></div>');
  const flags=checkInteractions();
  const safety=flags.length?'<div class="sec-title">Safety connections</div>'+flags.map(f=>connCard('<div class="between" style="margin-bottom:8px"><div class="row" style="gap:8px"><span style="width:32px;height:32px;border-radius:9px;background:'+(f.sev==='high'?'var(--danger-soft);color:var(--danger)':'var(--amber-soft);color:#B4741A')+';display:grid;place-items:center">'+icon('link')+'</span><b>'+esc(f.a)+' + '+esc(f.b)+'</b></div><span class="pill '+(f.sev==='high'?'danger':'amber')+'">'+f.sev+' risk</span></div><p class="muted" style="margin:0">'+esc(f.note)+' Vita spotted this across your medications, supplements, and TCM entries.</p><div class="row" style="gap:8px;margin-top:14px"><button class="btn btn-primary btn-sm" data-action="conn-send" data-msg="Vita flagged a possible interaction: '+esc(f.a)+' + '+esc(f.b)+' — '+esc(f.note)+' Should I change anything?">'+icon('send')+'Send to Dr. Reyes</button>'+(state.patient.careCircle.open?'<button class="btn btn-ghost btn-sm" data-action="conn-circle" data-msg="Vita flagged '+esc(f.a)+' + '+esc(f.b)+' ('+esc(f.note)+'). Flagging for the team.">Share to Care Circle</button>':'')+'</div>')).join(''):'';
  return head('Connections','Patterns Vita finds across your data — and can pass along to your doctor.')+

}

/* ============================ ACTIONS ============================ */
function handle(action,el){
  const p=state.patient;const d=el.dataset;
  switch(action){
    case 'set-view':state.ui.view=d.view;render();break;
    case 'p-nav':state.ui.patientTab=d.tab;state.badges[d.tab]=0;render();break;
    case 'd-nav':state.ui.doctorTab=d.tab;render();break;
    case 'dismiss-banner-p':state.ui.bannerP=false;render();break;
    case 'dismiss-banner-d':state.ui.bannerD=false;render();break;
    /* patient messaging */
    case 'pt-open-thread':state.ui.msgThread=d.thread;render();break;
    case 'pt-send':{const v=($('pt-msg-input').value||'').trim();if(!v)break;p.messages[state.ui.msgThread].push({sender:'patient',text:v,time:now()});render();break;}
    /* widgets */
    case 'pt-add-widget':{const k=$('pt-w-kind').value;const l=($('pt-w-label').value||'').trim();if(!l){toast('Give your widget a label');break;}const titles={drop:'Hydration',shoe:'Steps goal',moon:'Sleep goal',heart:'BP check-in',clock:'Fasting timer'};p.widgets.push({id:uid('w'),kind:k,title:titles[k]||'Widget',by:'You',value:l,sub:'Tracking'});toast('Widget added','On your dashboard');render();break;}
    case 'pt-remove-widget':p.widgets=p.widgets.filter(w=>w.id!==d.id);render();break;
    /* meds */
    case 'pt-refill':{const m=p.meds.find(x=>x.id===d.id);if(m){m.refilling=true;m.daysLeft=m.supply;toast('Refill requested',p.pharmacy.name);render();}break;}
    case 'pt-toggle-addmed':state.ui.showAddMed=!state.ui.showAddMed;render();break;
    case 'pt-add-med':{const n=($('pt-med-name').value||'').trim();if(!n){toast('Enter a medication name');break;}const qty=30;p.meds.push({id:uid('m'),name:n,dose:($('pt-med-dose').value||'').trim(),schedule:($('pt-med-sched').value||'as directed').trim(),prescriber:'Self-added (OTC)',reason:'Personal',supply:qty,daysLeft:qty,self:true,refilling:false});state.ui.showAddMed=false;const f=checkInteractions();if(f.length&&(f[0].a===n||f[0].b===n))toast('Heads up — possible interaction','Check the flag above','warn');else toast('Medication added');render();break;}
    /* billing */
    case 'pt-pay':{const b=p.billing.find(x=>x.id===d.id);if(b){b.status='paid';toast('Payment sent',money(b.amount)+' · '+p.payment);render();}break;}
    /* documents */
    case 'doc-view':{const doc=p.documents.find(x=>x.id===d.id);openModal('<button class="close btn-quiet" data-action="modal-close">'+icon('x')+'</button><h3>'+esc(doc.name)+'</h3><p class="muted tiny" style="font-weight:600">'+esc(doc.type)+' · '+fmtDate(doc.date)+' · '+esc(doc.source)+'</p><div class="card" style="margin-top:14px;background:var(--surface-2);font-family:monospace;font-size:12px;line-height:1.8">'+esc(doc.name)+'\n————————————\nResult: Within normal limits\nReviewed by '+esc(doc.source)+'\n\n(Demo preview — real file would render here.)</div><button class="btn btn-ghost btn-sm" style="margin-top:14px" data-action="modal-close">Close</button>');break;}
    case 'doc-download':{const doc=p.documents.find(x=>x.id===d.id);toast('Downloaded',doc.name+'.pdf');break;}
    case 'doc-share':{const doc=p.documents.find(x=>x.id===d.id);openModal('<button class="close btn-quiet" data-action="modal-close">'+icon('x')+'</button><h3>Send document</h3><p class="muted tiny" style="font-weight:600">Sending <b>'+esc(doc.name)+'</b> to any provider — even one not on Vita.</p><div class="field" style="margin-top:14px"><label>Provider email or fax</label><input class="inp" id="share-to" placeholder="clinic@example.com"></div><button class="btn btn-sage" data-action="doc-share-send" data-id="'+doc.id+'">'+icon('send')+'Send securely</button>');break;}
    case 'doc-share-send':{const to=($('share-to').value||'').trim();closeModal();toast('Document sent',to?('To '+to):'Securely delivered');break;}
    case 'doc-upload':openModal('<button class="close btn-quiet" data-action="modal-close">'+icon('x')+'</button><h3>Upload document</h3><div class="field" style="margin-top:12px"><label>Document name</label><input class="inp" id="up-name" placeholder="e.g. Vaccination card"></div><div class="field"><label>Type</label><select class="inp" id="up-type"><option>Lab result</option><option>Imaging</option><option>Immunization</option><option>Other</option></select></div><button class="btn btn-primary" data-action="doc-upload-save">'+icon('dl')+'Save to Documents</button>');break;
    case 'doc-upload-save':{const n=($('up-name').value||'').trim();if(!n){toast('Name the document');break;}p.documents.unshift({id:uid('d'),name:n,type:$('up-type').value,date:new Date().toISOString().slice(0,10),source:'Uploaded by you'});closeModal();toast('Document saved');render();break;}
    /* trends */
    case 'trend-metric':state.ui.trendMetric=d.metric;render();break;
    case 'pt-add-reading':{const val=parseFloat($('pt-reading').value);if(isNaN(val)){toast('Enter a number');break;}const T=p.trends[state.ui.trendMetric];T.pts.push({t:'Now',v:val,v2:state.ui.trendMetric==='bp'?Math.round(val*0.64):undefined,src:'manual'});toast('Reading added','Chart updated');render();break;}
    /* supplements */
    case 'supp-research':{const q=($('pt-supp-search').value||'').trim().toLowerCase();state.ui.suppSearched=true;let hit=null;for(const k in SUPP_DB){if(k.includes(q)||q.includes(k.split(' ')[0])){hit=Object.assign({name:$('pt-supp-search').value.trim()},SUPP_DB[k]);break;}}state.ui.suppResult=hit;render();break;}
    case 'pt-toggle-addsupp':state.ui.showAddSupp=!state.ui.showAddSupp;render();break;
    case 'pt-add-supp':{const n=($('pt-supp-name').value||'').trim();if(!n){toast('Enter a supplement');break;}p.supplements.push({id:uid('s'),name:n,dose:($('pt-supp-dose').value||'as directed').trim(),purpose:'Personal'});state.ui.showAddSupp=false;const f=checkInteractions();if(f.some(x=>x.a===n||x.b===n))toast('Possible interaction found','See the flag above','warn');else toast('Supplement added');render();break;}
    case 'pt-remove-supp':p.supplements=p.supplements.filter(s=>s.id!==d.id);render();break;
    /* AI */
    case 'ai-send':{const v=($('pt-ai-input').value||'').trim();if(!v)break;p.aiChat.push({sender:'user',text:v});p.aiChat.push({sender:'ai',text:botReply(v)});render();break;}
    case 'ai-chip':{p.aiChat.push({sender:'user',text:d.q});p.aiChat.push({sender:'ai',text:botReply(d.q)});render();break;}
    /* schedule */
    case 'book-pick':state.ui.bookOpen=state.ui.bookOpen===d.id?null:d.id;render();break;
    case 'book-slot':{const doc=DIRECTORY.find(x=>x.id===d.id);p.appts.push({id:uid('a'),doctorId:doc.id,doctor:doc.name,type:(p.doctors.some(x=>x.id===doc.id)?'Follow-up visit':'First-time visit'),date:'2026-06-'+(8+Math.floor(Math.random()*6)),time:d.slot.split('· ')[1]||'10:00 AM',mode:'In-person'});state.ui.bookOpen=null;toast('Visit booked','With '+doc.name);render();break;}
    case 'appt-cancel':p.appts=p.appts.filter(a=>a.id!==d.id);toast('Visit cancelled');render();break;
    /* ===== DOCTOR ===== */
    case 'dr-select-patient':state.ui.selectedPatientId=$('dr-patient-select').value;render();break;
    case 'dr-open-chart':state.ui.selectedPatientId=d.id;state.ui.doctorTab='chart';render();break;
    case 'dr-open-thread':state.ui.drThread=d.id;render();break;
    case 'dr-send-msg':{const v=($('dr-msg-input').value||'').trim();if(!v)break;const id=state.ui.drThread;const th=id==='maya'?p.messages.reyes:state.drThreads[id];th.push({sender:'doctor',text:v,time:now()});if(id==='maya'){bump('messages');toast('Message sent to Maya','Now in her Vita inbox','sync');}else toast('Message sent');render();break;}
    case 'dr-start-tele':openTele(d.id);break;
    case 'tele-end':$('teleHost').innerHTML='';toast('Visit ended');break;
    case 'dr-save-note':{const id=state.ui.selectedPatientId;const note={type:($('dr-visit-type').value||'Visit').trim(),s:$('dr-s').value.trim(),o:$('dr-o').value.trim(),a:$('dr-a').value.trim(),pp:$('dr-p').value.trim(),date:new Date().toISOString().slice(0,10),doctor:'Dr. Marisol Reyes'};if(id==='maya'){p.notes.unshift({id:uid('n'),doctorId:'reyes',doctor:'Dr. Marisol Reyes',date:note.date,type:note.type,s:note.s,o:note.o,a:note.a,p:note.pp});bump('records');toast('Note signed','Now in Maya\u2019s Records','sync');}else{DPATIENTS[id].notes.unshift({doctor:'Dr. Marisol Reyes',date:note.date,type:note.type,s:note.s,o:note.o,a:note.a,p:note.pp});toast('Note signed');}render();break;}
    case 'dr-send-rx':{const id=state.ui.selectedPatientId;const name=($('dr-rx-name').value||'').trim();if(!name){toast('Enter a medication');break;}const qty=parseInt($('dr-rx-qty').value)||30;const med={id:uid('m'),name:name,dose:($('dr-rx-dose').value||'').trim(),schedule:($('dr-rx-freq').value||'as directed').trim(),prescriber:'Dr. Marisol Reyes',reason:'As prescribed',supply:qty,daysLeft:qty,self:false,refilling:false};if(id==='maya'){p.meds.push(med);bump('medications');const f=checkInteractions();const inv=f.find(x=>x.a===name||x.b===name);if(inv)toast('Sent — interaction flagged','Maya sees '+inv.sev+' warning','warn');else toast('Prescription sent to Maya','In her Medications tab','sync');}else toast('Prescription sent');render();break;}
    case 'dr-add-widget':{const id=state.ui.selectedPatientId;const k=$('dr-wid-kind').value;const l=($('dr-wid-label').value||'').trim();if(!l){toast('Add an instruction');break;}const titles={heart:'BP check-in',pill:'Med reminder',drop:'Hydration',shoe:'Steps goal',moon:'Sleep goal',spark:'Mood check-in'};if(id==='maya'){p.widgets.push({id:uid('w'),kind:k,title:titles[k],by:'Dr. Reyes',value:l,sub:'From your doctor'});bump('home');toast('Widget added to Maya','On her Home tab','sync');}else toast('Widget added');render();break;}
    case 'dr-bill-quick':{$('dr-bill-desc').value=d.desc;$('dr-bill-amt').value=d.amt;break;}
    case 'dr-send-bill':{const id=state.ui.selectedPatientId;const desc=($('dr-bill-desc').value||'').trim();const amt=parseFloat($('dr-bill-amt').value);if(!desc||isNaN(amt)){toast('Add a description and amount');break;}if(id==='maya'){p.billing.unshift({id:uid('b'),desc:desc,doctor:'Dr. Marisol Reyes',amount:amt,due:'2026-07-01',status:'due'});bump('billing');toast('Charge sent to Maya',money(amt)+' · in her Billing tab','sync');}else toast('Charge created');render();break;}
    case 'dr-record-vital':{const m=$('dr-vital-metric').value;const val=parseFloat($('dr-vital-value').value);if(isNaN(val)){toast('Enter a value');break;}const T=p.trends[m];T.pts.push({t:'Now',v:val,v2:m==='bp'?Math.round(val*0.64):undefined,src:'ehr'});bump('trends');toast('Reading added to chart','Plotted on Maya\u2019s Trends','sync');render();break;}
    /* care circle */
    case 'circle-open':{const c=p.careCircle;c.open=true;if(!c.messages.length)c.messages.push({sender:'reyes',text:'Team — Maya\u2019s lipid panel and INR both look good. I\u2019m renewing warfarin at the same dose.',time:'9:02 AM'},{sender:'lindqvist',text:'Agreed, 2.4 is right in range. No changes from cardiology.',time:'9:14 AM'},{sender:'anand',text:'No dermatology concerns. Her skin check is booked for June 12.',time:'9:20 AM'});toast('Care circle opened','Your team can coordinate now');render();break;}
    case 'circle-close':p.careCircle.open=false;toast('Care circle closed','Doctors can no longer post');render();break;
    case 'pt-circle-send':{const v=($('pt-circle-input').value||'').trim();if(!v)break;p.careCircle.messages.push({sender:'patient',text:v,time:now()});render();break;}
    case 'dr-circle-send':{const v=($('dr-circle-input').value||'').trim();if(!v)break;p.careCircle.messages.push({sender:'reyes',text:v,time:now()});bump('circle');toast('Posted to Maya\u2019s care circle','She and the team see it','sync');render();break;}
    /* tcm + daily log */
    case 'toggle-addtcm':state.ui.showAddTcm=!state.ui.showAddTcm;render();break;
    case 'add-tcm':{const n=($('tcm-name').value||'').trim();if(!n){toast('Enter a name');break;}const k=$('tcm-kind').value;p.tcm.push({id:uid('t'),name:n,kind:k,detail:($('tcm-detail').value||'').trim()||(k==='herb'?'As directed':'As scheduled')});state.ui.showAddTcm=false;const f=checkInteractions();if(k==='herb'&&f.some(x=>x.a===n||x.b===n))toast('Possible interaction found','See the flag above','warn');else toast('Added to TCM log');render();break;}
    case 'remove-tcm':p.tcm=p.tcm.filter(t=>t.id!==d.id);render();break;
    case 'pt-log-daily':{const type=$('log-type').value;const val=($('log-value').value||'').trim();if(!val){toast('Enter a value');break;}const icons={Meditation:'lotus',Sleep:'moon',Exercise:'shoe',Water:'drop',Mood:'heart'};const units={Meditation:' min',Sleep:' hrs',Water:' cups'};p.dailyLog.unshift({id:uid('l'),date:'Today',type:type,value:val+(units[type]||''),icon:icons[type]||'spark'});const num=parseFloat(val);if(type==='Meditation'&&!isNaN(num))p.habits.meditation.push({d:'Today',v:num});if(type==='Sleep'&&!isNaN(num))p.habits.sleep.push({d:'Today',v:num});toast(type+' logged',(type==='Meditation'||type==='Sleep')?'Connections updated':'');render();break;}
    /* connections */
    case 'conn-send':{p.messages.reyes.push({sender:'patient',text:d.msg,time:now()});toast('Sent to Dr. Reyes','Now in your Messages');render();break;}
    case 'conn-circle':{if(!p.careCircle.open){toast('Open your care circle first');break;}p.careCircle.messages.push({sender:'patient',text:d.msg,time:now()});bump('circle');toast('Shared to Care Circle');render();break;}
    /* emergency */
    case 'toggle-addec':state.ui.showAddEC=!state.ui.showAddEC;render();break;
    case 'add-econtact':{const n=($('ec-name').value||'').trim();if(!n){toast('Enter a name');break;}p.emergencyContacts.push({id:uid('ec'),name:n,relation:($('ec-relation').value||'Contact').trim(),phone:($('ec-phone').value||'').trim()});state.ui.showAddEC=false;toast('Contact added');render();break;}
    case 'remove-econtact':p.emergencyContacts=p.emergencyContacts.filter(c=>c.id!==d.id);render();break;
    case 'emergency-open':openEmergency();break;
    case 'emergency-close':$('teleHost').innerHTML='';break;
    case 'emergency-copy':toast('Access link copied','Share it with a trusted person');break;
    case 'call-mock':toast('Calling '+(d.name||'contact')+'…');break;
    case 'modal-close':closeModal();break;
  }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='dr-select-patient')return;if(el.dataset.action==='modal-back'){if(e.target.classList.contains('modal-back'))closeModal();return;}handle(el.dataset.action,el);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-action]');if(el&&el.dataset.action==='dr-select-patient')handle('dr-select-patient',el);});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;const id=e.target.id;
  const map={'pt-msg-input':'pt-send','dr-msg-input':'dr-send-msg','pt-ai-input':'ai-send','pt-supp-search':'supp-research','pt-reading':'pt-add-reading','pt-circle-input':'pt-circle-send','dr-circle-input':'dr-circle-send','log-value':'pt-log-daily','pt-doc-search':null};
  if(id==='pt-doc-search'){state.ui.bookQuery=e.target.value;render();return;}
  if(id in map&&map[id]){e.preventDefault();handle(map[id],e.target);}
});
document.addEventListener('input',e=>{if(e.target.id==='pt-doc-search'){state.ui.bookQuery=e.target.value;}});

/* ============================ INIT ============================ */
$('brandDot').innerHTML=icon('heart');
$('ic-user').innerHTML=icon('user');
$('ic-steth').innerHTML=icon('steth');
render();
</script>
</body>
</html>
